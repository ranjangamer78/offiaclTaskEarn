    <style>
      /* Ensure no white screen flash while loading */
      html, body {
        background-color: #020617 !important;
        color: #f8fafc;

        padding: 0;
        min-height: 100vh;
      }
      @keyframes spin {

    <script>
      // Automatically redirect to trailing slash on GitHub Pages so relative assets load properly
      if (location.pathname.slice(-1) !== '/' && !location.pathname.split('/').pop().includes('.')) {
        location.replace(location.pathname + '/' + location.search + location.hash);
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />

  </head>
